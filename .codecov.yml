codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

ignore:
  - "tests/"
  - "deps/"

parsers:
  gcov:
    branch_detection:
      - conditional
      - loop
      - method
      - macro

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
