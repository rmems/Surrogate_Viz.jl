# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Draft CodeRabbit config for rmems/Surrogate_Viz.jl (generated locally, not pushed).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!outputs/**'
  path_instructions:
  - path: '{src,ext,test}/**/*.jl'
    instructions: 'Julia package code. `[compat] julia = "1.12"`; CI runs Julia 1.12 (hosted CPU job). Do not use Base/stdlib APIs newer than the compat floor without raising it. Review for type stability in hot paths (concrete struct field types, no abstractly typed containers, no non-`const` globals, no `Any`-returning branches), avoidable allocations in inner loops, and changes to exported API. CUDA support lives in the `CUDABackendExt` weak-dep extension: `src/` must not `using CUDA`, and `CUDABackend` must fall back to CPU when CUDA is absent (tested).'
  - path: '*.jl'
    instructions: Top-level analysis scripts (SAAQ discovery/plots) that write to `outputs/`; review logic and paths, not generated results.
  - path: '**/Project.toml'
    instructions: Julia Project.toml. New `[deps]` entries should get a `[compat]` bound; flag widened or dropped bounds and any UUID change (UUIDs are immutable once registered).
  - path: '**/Manifest.toml'
    instructions: Resolver output committed on purpose. Do not review it line by line; only flag a changed `julia_version`, churn that is not explained by a Project.toml change, or resolved versions that violate `[compat]`.
  - path: Dockerfile
    instructions: Dockerfile. Keep secrets out of layers and build args, and keep toolchain versions in line with the CI pins. Base image is `nvidia/cuda:13.2.0-devel-ubuntu22.04`; keep the CUDA version in step with the GPU runners.
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too. GPU jobs run on `[self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]` and are gated by `if:`; keep them unreachable from fork PRs.
  tools:
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
