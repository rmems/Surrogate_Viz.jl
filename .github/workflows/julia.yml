name: Julia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY: default to read-only. cuda-visuals + gpu-preflight tighten further.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ---------------------------------------------------------------------------
  # GPU preflight + CUDA / GPU job for the pure-Julia CUDA visual kernels.
  # ---------------------------------------------------------------------------

  gpu-preflight:
    name: GPU/Docker preflight (host + container nvidia-smi)
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host GPU/Docker preflight
        run: |
          set -eux
          whoami
          id
          groups
          DOCKER_BIN="$(command -v docker || true)"
          if [ -z "$DOCKER_BIN" ] && [ -x /usr/bin/docker ]; then
            DOCKER_BIN=/usr/bin/docker
          fi
          [ -n "$DOCKER_BIN" ]
          "$DOCKER_BIN" version
          "$DOCKER_BIN" info | sed -n '1,80p'
          command -v nvidia-smi || true
          nvidia-smi || true
          echo "=== basic nvidia/cuda image (no --gpus, for pull test) ==="
          "$DOCKER_BIN" run --rm nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi || true
          echo "=== with --gpus all (this must succeed or cuda-visuals will fail) ==="
          "$DOCKER_BIN" run --rm --gpus all nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi

  cuda-visuals:
    name: CUDA visual kernels (pure Julia CUDA.jl + synthetic data)
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run CUDA + Julia 1.12 visual kernel tests inside pinned nvidia/cuda container
        run: bash .github/scripts/run_cuda_visuals.sh
