# ------------------------------------------------------------------------------------
# Grok Build 0.1 model + host setup (the piece "GPT-5.4 mini could not fix" because it
# is out-of-band for the runner user).
#
# If the --gpus lines above (or the ones inside cuda-visuals) fail with permission,
# "could not select device driver", or the container nvidia-smi is empty, the
# actions-runner Listener user on the 5080 host does not have a working docker +
# nvidia-container-toolkit setup.
#
# ONE-TIME COMMANDS (run as the user that executes ~/actions-runner/run.sh, or
# with sudo for the usermod/ctk steps, then switch to that user for the Listener):
#
#   sudo usermod -aG docker $USER
#   # log out / in or `newgrp docker` or start a fresh shell for the group to take
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#
#   # verify from a *new* shell for that exact user
#   docker run --rm --gpus all nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi
#
#   # then (re)start the listener in that shell / as that user
#   cd ~/actions-runner
#   ./run.sh   # or nohup ./run.sh &
#
# After the "docker" label update you did in Settings, the workflows declare the
# full label set. The runner must be (re)started *after* the group + toolkit steps.
#
# Manual repro you can copy-paste on the 5080 host (after the above setup) to
# prove the exact command the cuda-visuals step will run:
#
#   git clone --branch feat/og-png-data-cuda-visuals-sm120-runner-grok-build-0.1 \
#       https://github.com/rmems/Surrogate_Viz.jl.git /tmp/sviz-ci-repro
#   cd /tmp/sviz-ci-repro
#   bash .github/scripts/run_cuda_visuals.sh
#
# It should print the "Pure-Julia CUDA visual kernel test passed" line and the
# device/cap for your RTX 5080.
# ------------------------------------------------------------------------------------

  cuda-visuals:
    name: CUDA visual kernels (pure Julia CUDA.jl + synthetic data)
    needs: gpu-preflight
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run CUDA + Julia 1.12 visual kernel tests inside pinned nvidia/cuda container
        run: bash .github/scripts/run_cuda_visuals.sh
