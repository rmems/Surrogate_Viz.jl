name: Julia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ---------------------------------------------------------------------------
  # CUDA / GPU job for the pure-Julia CUDA visual kernels (walker density, path,
  # spiking overlays).
  #
  # This job + the kernel implementation + runner hardening = the combined PR for
  # the #43 visuals + #44 (self-hosted Julia CUDA runner) scope.
  #
  # Grok Build 0.1 model: security is first-class. The self-hosted runner (at
  # ~/actions-runner/) must never be exposed to arbitrary code from
  # forks or untrusted clones. The if-guard below + label discipline + review
  # requirements are mandatory (see GH#44 for the full security spec).
  # ---------------------------------------------------------------------------
  cuda-visuals:
    # Only run on the protected self-hosted runner (labels: self-hosted, gpu, sm120, julia-cuda).
    # The label must be one that untrusted jobs cannot accidentally select.
    runs-on: [self-hosted, gpu, sm120, julia-cuda]
    # Security guard (Grok Build 0.1 model): do not let forks or external PRs
    # run on the GPU host without explicit approval. This (and the review
    # requirement on the runner) is part of the hardening for GH#44.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # Docker GPU execution through actions-runner (Grok Build 0.1 model).
      # Pattern taken from corinth-canal (read-only inspiration):
      #   - actions-runner (the bare listener registered via config.sh/run.sh)
      #     is what claims and runs this job on the host.
      #   - Inside the job we use `docker run --gpus all` against a pinned
      #     nvidia/cuda:12.8.1-devel-ubuntu22.04 (for sm_120 / RTX 5080).
      #   - Julia 1.12 + project deps + the pure-Julia CUDA kernels are
      #     set up *inside* the ephemeral container (exact match to
      #     corinth-canal/.github/workflows/gpu-tests.yml "Compile CUDA targets
      #     in pinned Ubuntu 22.04 toolchain" step).
      # Benefits: reproducible env, no reliance on host-global Julia/CUDA.jl
      # install, GPU passthrough via nvidia-container-toolkit. The root
      # Dockerfile provides an equivalent full image for manual use or
      # future docker-build jobs.
      #
      # Stopped using og data: synthetic DataFrame only. No plot include.
      - name: Run CUDA + Julia 1.12 visual kernel tests inside pinned nvidia/cuda container
        run: |
          docker run --rm --gpus all \
            -v "$PWD:/app" \
            -w /app \
            nvidia/cuda:12.8.1-devel-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null 2>&1
              apt-get install -y curl ca-certificates git >/dev/null 2>&1

              # Install Julia 1.12 (official tarball; non-interactive, reliable in containers)
              JULIA_VER=1.12.0
              curl -fsSL "https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-${JULIA_VER}-linux-x86_64.tar.gz" -o /tmp/julia.tar.gz
              tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1
              rm -f /tmp/julia.tar.gz
              export PATH=/usr/local/bin:$PATH
              julia --version

              # Verify GPU passthrough (the reason we pass --gpus all from the actions-runner step)
              echo "=== nvidia-smi (inside container) ==="
              nvidia-smi || echo "nvidia-smi returned non-zero (driver passthrough?)"

              # Instantiate (CUDA.jl is weakdep; will pull artifacts for the container CUDA)
              julia --project=. -e "
                using Pkg
                Pkg.instantiate()
                println(\"Instantiate done (Grok Build 0.1 model)\")
              "

              # Verify CUDA (executes on the sm_120 device passed through)
              julia --project=. -e '
                using CUDA
                println("CUDA.jl version info:")
                CUDA.versioninfo()
                dev = CUDA.device()
                println("Device: ", CUDA.name(dev), " cap=", CUDA.capability(dev))
              '

              # Test the pure-Julia CUDA visual kernels (synthetic only)
              julia --project=. -e '
                using Surrogate_Viz, DataFrames
                # Grok Build 0.1 model: Stopped using og data in directories per user request.
                # Use synthetic for kernel test in CI. (corinth-canal docker style)
                df = DataFrame(tick=1:100, best_walker=rand(1:2047, 100))
                edges, counts = walker_density_bins_and_counts(df.best_walker; n_bins=32, max_walker=2047)
                println("CUDA (or fallback) walker density histogram produced $(length(counts)) bins, sum=", sum(counts))
                @assert length(counts) == 32
                println("Pure-Julia CUDA visual kernel test passed (Grok Build 0.1 model).")
              '

              # Optional PNG regen (script has main() guard; uses telemetry_math_logic.txt, no og)
              julia plot_latent_space.jl data/telemetry_math_logic.txt /tmp/ci_map.png || echo "plot script completed (or fell back; data may be required for full output)"
            '
