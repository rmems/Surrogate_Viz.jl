name: Julia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY: default to read-only. cuda-visuals + gpu-preflight tighten further.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ---------------------------------------------------------------------------
  # GPU preflight + CUDA / GPU job for the pure-Julia CUDA visual kernels.
  #
  # Split per diagnosis (Grok Build 0.1 model + corinth-canal style):
  #   - gpu-preflight: prove the actions-runner can talk to Docker + NVIDIA
  #     runtime + pull the base image + get GPU passthrough (host + container
  #     nvidia-smi). Fails fast and visibly if runtime/image is the problem.
  #   - cuda-visuals: the actual test (needs: gpu-preflight). Runs the Julia
  #     1.12 + explicit CUDA (because weakdep+extension) + synthetic kernel test
  #     inside the same pinned nvidia/cuda container.
  #
  # Docker-build is the separate .github/workflows/docker-build.yml (with
  # lowercase GHCR fix).
  #
  # Security, labels, synthetic data, no og, main() guards, etc. all preserved.
  # The CPU `test` job (ubuntu-latest + setup-julia) continues to run for
  # local machine CPU verification (`julia --project=. -e 'using Pkg; Pkg.test()'`
  # locally + in CI).
  # ---------------------------------------------------------------------------

  gpu-preflight:
    name: GPU/Docker preflight (host + container nvidia-smi)
    # Only the protected self-hosted runner.
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    # SECURITY (Grok Build 0.1 model)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host GPU/Docker preflight
        run: |
          set -x
          whoami
          id
          groups
          docker version
          docker info | sed -n '1,80p'
          nvidia-smi || true
          echo "=== basic nvidia/cuda image (no --gpus, for pull test) ==="
          docker run --rm nvidia/cuda:12.8.1-devel-ubuntu22.04 nvidia-smi || true
          echo "=== with --gpus all (this must succeed or cuda-visuals will fail) ==="
          docker run --rm --gpus all nvidia/cuda:12.8.1-devel-ubuntu22.04 nvidia-smi

  cuda-visuals:
    name: CUDA visual kernels (pure Julia CUDA.jl + synthetic data)
    needs: gpu-preflight
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Docker GPU execution through actions-runner (Grok Build 0.1 model).
      # corinth-canal read-only pattern for the actual work (after preflight proved the runtime).
      # Explicit Pkg.add("CUDA") because CUDA lives only in [weakdeps] + [extensions]
      # in this repo (Pkg.instantiate alone is not enough inside a fresh container).
      # Stopped using og data; synthetic only.
      - name: Run CUDA + Julia 1.12 visual kernel tests inside pinned nvidia/cuda container
        run: |
          docker run --rm --gpus all \
            -v "$PWD:/app" \
            -w /app \
            nvidia/cuda:12.8.1-devel-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null 2>&1
              apt-get install -y curl ca-certificates git >/dev/null 2>&1

              # Install Julia 1.12 (official tarball)
              JULIA_VER=1.12.0
              curl -fsSL "https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-${JULIA_VER}-linux-x86_64.tar.gz" -o /tmp/julia.tar.gz
              tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1
              rm -f /tmp/julia.tar.gz
              export PATH=/usr/local/bin:$PATH
              julia --version

              echo "=== nvidia-smi inside container (GPU passthrough from preflight + --gpus) ==="
              nvidia-smi

              # Key fix: CUDA is weakdep + CUDABackendExt. Must add explicitly for the test env.
              julia --project=. -e "
                using Pkg
                Pkg.instantiate()
                Pkg.add(\"CUDA\")
                Pkg.precompile()
                println(\"Instantiate + CUDA add + precompile done (Grok Build 0.1 model)\")
              "

              # Verify + assert functional (catches driver/runtime/CUDA.jl issues early)
              julia --project=. -e '
                using CUDA
                println("CUDA.jl version info:")
                CUDA.versioninfo()
                @assert CUDA.functional() "CUDA.functional() false inside container — no usable GPU"
                dev = CUDA.device()
                println("Device: ", CUDA.name(dev), " cap=", CUDA.capability(dev))
              '

              # The kernels under test (will now take the CUDA path)
              julia --project=. -e '
                using Surrogate_Viz, DataFrames
                # Grok Build 0.1 model: synthetic only (no og data per request)
                df = DataFrame(tick=1:100, best_walker=rand(1:2047, 100))
                edges, counts = walker_density_bins_and_counts(df.best_walker; n_bins=32, max_walker=2047)
                println("CUDA walker density histogram: $(length(counts)) bins, sum=", sum(counts))
                @assert length(counts) == 32
                println("Pure-Julia CUDA visual kernel test passed (Grok Build 0.1 model).")
              '

              # Optional plot (guarded main(), telemetry_math_logic.txt, no og)
              julia plot_latent_space.jl data/telemetry_math_logic.txt /tmp/ci_map.png || echo "plot step done or fell back"
            '
