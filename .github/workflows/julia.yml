name: Julia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY: default to read-only. cuda-visuals + gpu-preflight tighten further.
permissions:
  contents: read

jobs:
  test:
    # CPU-only job. This is the one that runs locally on your machine
    # (`julia --project=. -e 'using Pkg; Pkg.test()'`) and on GitHub-hosted
    # ubuntu-latest. It must stay reliable and is intentionally *not* on the
    # self-hosted GPU runner. (Grok Build 0.1 model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ---------------------------------------------------------------------------
  # GPU preflight + CUDA / GPU job for the pure-Julia CUDA visual kernels.
  # ---------------------------------------------------------------------------

  gpu-preflight:
    name: GPU/Docker preflight (host + container nvidia-smi)
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
