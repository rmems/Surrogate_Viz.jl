name: Docker Build (CUDA 13.2 + Julia 1.12)
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# SECURITY: Restrict top-level permissions to read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMAGE:main"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS,$IMAGE:pr-${{ github.event.number }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=13.2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

# This workflow handles PR-time Docker verification only. Publishing lives in
# `.github/workflows/docker-publish.yml` so PRs do not show an intentionally
# skipped publish job.
#
# Runs on ubuntu-latest, not the self-hosted GPU runner. Building a CUDA image
# only needs `docker build` — no GPU is required, since nothing in the image is
# executed here. Keeping this off the self-hosted box means only jobs that
# genuinely need the RTX 5080 (test, gpu-preflight, cuda-visuals in julia.yml)
# run on a host that is shared with several other repositories' runners.
